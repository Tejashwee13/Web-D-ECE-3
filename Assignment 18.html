<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ABC College Admission 2026</title>
</head>
<body>

    <header>
        <h1 align="center">ABC College Admission 2026</h1>
    </header>

    <main>
        <h2>Courses and Fees</h2>

        <table border="1" width="100%" cellspacing="0" cellpadding="6">
            <caption>Available Courses</caption>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Seats</th>
                    <th>Fees</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>&#8377;90,000</td>
                </tr>
                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>&#8377;45,000</td>
                </tr>
            </tbody>
        </table>
        <br>

        <form>
            <fieldset>
                <legend>Application Form</legend>

                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name">
                <br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email">
                <br><br>

                <label for="course">Course:</label><br>
                <select id="course" name="course">
                    <option value="B.Tech CSE" selected>B.Tech CSE</option>
                    <option value="BCA">BCA</option>
                </select>
                <br><br>

                <label for="statement">Statement:</label><br>
                <textarea id="statement" name="statement" rows="4" cols="40"></textarea>
                <br><br>

                <input type="submit" value="Apply">
            </fieldset>
        </form>
    </main>

    <footer>
        <p align="center">&copy; 2026 ABC College</p>
    </footer>

</body>
</html>
